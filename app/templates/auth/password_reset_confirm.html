{% extends "base.html" %}

{% block title %}Reset Your Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Set Your New Password</h2>
                    
                    <div id="message-area" class="mb-3"></div>

                    <form id="reset-password-form">
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new_password" required>
                        </div>
                         <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirm_password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const messageArea = document.getElementById('message-area');
    
    if (newPassword !== confirmPassword) {
        messageArea.innerHTML = '<div class="alert alert-danger">Passwords do not match.</div>';
        return;
    }

    // The token is passed from the URL into the template by our frontend route
    const token = "{{ token }}";

    try {
        const response = await fetch('/api/auth/password/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, new_password: newPassword })
        });
        const data = await response.json();

        if (response.ok) {
            messageArea.innerHTML = `<div class="alert alert-success">${data.message} You can now <a href="{{ url_for('frontend.login') }}">log in</a>.</div>`;
            document.getElementById('reset-password-form').style.display = 'none';
        } else {
            messageArea.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }

    } catch (error) {
        messageArea.innerHTML = `<div class="alert alert-danger">An error occurred. Please try again.</div>`;
    }
});
</script>
{% endblock %}
