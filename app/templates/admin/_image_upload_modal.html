<div class="modal fade" id="imageUploadModal" tabindex="-1" aria-labelledby="imageUploadModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="imageUploadModalLabel"><i class="bi bi-image me-2"></i>Upload Image to S3</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Upload an image to get a secure S3 link. You can then copy this link and paste it into your content editor.</p>
        
        <form id="imageUploadModalForm">
            <div class="input-group">
                <input class="form-control" type="file" id="imageFileInput" accept="image/*" required>
                <button class="btn btn-primary" type="submit" id="modalUploadBtn">
                    <span class="spinner-border spinner-border-sm d-none me-1"></span>
                    <i class="bi bi-upload me-1"></i> Upload
                </button>
            </div>
        </form>

        <div id="uploadResult" class="mt-3" style="display: none;">
            <div class="alert alert-success d-flex align-items-center">
                <div class="flex-grow-1">
                    <strong>Success!</strong> Image URL copied to clipboard.
                    <input type="text" id="imageUrlResult" class="form-control form-control-sm mt-2" readonly>
                </div>
                <button class="btn btn-outline-secondary ms-2" id="copyUrlBtn"><i class="bi bi-clipboard"></i></button>
            </div>
        </div>
        <div id="uploadError" class="mt-3 alert alert-danger" style="display: none;"></div>
      </div>
    </div>
  </div>
</div>
