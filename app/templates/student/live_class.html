{% extends 'base.html' %}

{% block title %}{{ live_class.title }}{% endblock %}

{% block head_extra %}
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        .live-class-layout {
            display: flex;
            height: calc(100vh - 80px); /* Adjust based on your navbar height */
            gap: 15px;
        }
        .video-container {
            flex-grow: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .chat-container {
            width: 350px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            border-left: 1px solid #dee2e6;
        }
        .chat-header {
            padding: 15px;
            font-weight: 600;
            background-color: #e9ecef;
            border-bottom: 1px solid #dee2e6;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .chat-input {
            padding: 15px;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }
        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .message.my-message {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }
        .message.their-message {
            background-color: #e9ecef;
            color: #212529;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }
        .message-sender {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .system-message {
            text-align: center;
            font-style: italic;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
    </style>
{% endblock %}

{% block content %}
<div class="live-class-layout">
    <div class="video-container" id="video-container">
        <iframe 
            width="100%" 
            height="100%" 
            src="{{ live_class.meeting_link }}" 
            title="Live Class Video" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="chat-container">
        <div class="chat-header"><i class="bi bi-chat-dots-fill me-2"></i>Live Class Chat</div>
        <div class="chat-messages" id="chat-messages">
            </div>
        <div class="chat-input">
            <input type="text" id="message-input" class="form-control" placeholder="Type a message...">
            <button id="send-btn" class="btn btn-primary"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
$(document).ready(function() {
    const classId = {{ live_class.id }};
    const currentUserId = {{ current_user_id }};
    const chatMessages = $('#chat-messages');
    const messageInput = $('#message-input');
    const sendBtn = $('#send-btn');
    let socket;

    async function initializeChat() {
        const token = await tokenProvider.getToken();
        if (!token) {
            chatMessages.append('<div class="system-message text-danger">Authentication failed. Cannot connect to chat.</div>');
            return;
        }

        socket = io({
            query: { token: token }
        });

        socket.on('connect', () => {
            console.log('Connected to chat server!');
            socket.emit('join_class_chat', { class_id: classId });
        });

        socket.on('connect_error', (err) => {
            console.error('Connection Error:', err.message);
            chatMessages.append('<div class="system-message text-danger">Could not connect to chat.</div>');
        });

        socket.on('user_joined', (data) => {
            chatMessages.append(`<div class="system-message">${data.message}</div>`);
            scrollToBottom();
        });

        socket.on('receive_message', (data) => {
            const isMyMessage = data.sender_id === currentUserId;
            const messageClass = isMyMessage ? 'my-message' : 'their-message';
            const senderName = isMyMessage ? 'You' : data.sender_name;
            
            const messageHtml = `
                <div class="message ${messageClass}">
                    <div class="message-sender">${senderName}</div>
                    <div>${data.message}</div>
                </div>
            `;
            chatMessages.append(messageHtml);
            scrollToBottom();
        });
    }

    function sendMessage() {
        const message = messageInput.val().trim();
        if (message && socket) {
            socket.emit('send_message', {
                class_id: classId,
                message: message
            });
            messageInput.val('');
        }
    }
    
    function scrollToBottom() {
        chatMessages.scrollTop(chatMessages[0].scrollHeight);
    }

    sendBtn.on('click', sendMessage);
    messageInput.on('keypress', function(e) {
        if (e.which === 13) { // Enter key
            sendMessage();
        }
    });

    initializeChat();
});
</script>
{% endblock %}
