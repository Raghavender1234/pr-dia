<div class="modal fade" id="videoUploadModal" tabindex="-1" aria-labelledby="videoUploadModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="videoUploadModalLabel"><i class="bi bi-camera-video me-2"></i>Upload Video to S3</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Upload a video to get a secure S3 link. You can then copy this link and paste it into your content editor.</p>
        <form id="videoUploadModalForm">
          <input class="form-control" type="file" id="videoFileInputModal" accept="video/*">
          <button class="btn btn-primary mt-3" type="submit" id="modalUploadVideoBtn">
            <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
            <i class="bi bi-upload me-1"></i> Upload
          </button>
        </form>
        <div id="uploadVideoResult" class="mt-3" style="display: none;">
          <label for="videoUrlResult" class="form-label">Video URL:</label>
          <div class="input-group">
            <input type="text" class="form-control" id="videoUrlResult" readonly>
            <button class="btn btn-outline-secondary" type="button" id="copyVideoUrlBtn"><i class="bi bi-clipboard"></i></button>
          </div>
        </div>
        <div id="uploadVideoError" class="mt-3 alert alert-danger" style="display: none;"></div>
      </div>
    </div>
  </div>
</div>
