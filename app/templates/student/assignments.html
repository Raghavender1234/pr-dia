{% extends "base.html" %}

{% block title %}My Assignments{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4"><i class="bi bi-journal-text me-2 text-primary"></i>My Assignments</h2>
    
    <!-- Nav tabs -->
    <ul class="nav nav-tabs mb-4" id="assignmentTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#todo">To Do</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#completed">Completed</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- TO DO TAB -->
        <div class="tab-pane fade show active" id="todo">
            <div id="todoContainer" class="row g-4"></div>
        </div>
        <!-- COMPLETED TAB -->
        <div class="tab-pane fade" id="completed">
            <div id="completedContainer" class="row g-4"></div>
        </div>
    </div>
</div>

<!-- Submit Modal -->
<div class="modal fade" id="submitModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Submit Assignment</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="submissionForm">
                <input type="hidden" id="submitAssignId" name="assignment_id">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Text Response (Optional)</label>
                        <textarea class="form-control" name="submission_text" rows="4" placeholder="Type your answer here..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Attach File (Scanned PDF/Doc/Image)</label>
                        <input type="file" class="form-control" name="file" accept=".pdf,.doc,.docx,.jpg,.png">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success" id="uploadBtn">
                        <span class="spinner-border spinner-border-sm d-none me-1"></span> Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
$(document).ready(function() {
    const loadAssignments = async () => {
        const res = await window.authenticatedFetch('/api/student/assignments');
        const data = await res.json();
        
        let todoHtml = '', completedHtml = '';
        data.forEach(a => {
            const due = new Date(a.due_date);
            const attachHtml = a.attachment_url ? 
                `<a href="${a.attachment_url}" target="_blank" class="btn btn-sm btn-outline-info mt-2 me-2"><i class="bi bi-file-earmark-arrow-down"></i> View Attached Material</a>` : '';
            
            if (!a.submission) {
                // Not submitted
                todoHtml += `
                    <div class="col-md-6"><div class="card h-100 shadow-sm border-start border-4 border-warning">
                        <div class="card-body">
                            <h5 class="card-title">${a.title}</h5>
                            <span class="badge bg-secondary mb-2">${a.exam_name}</span>
                            <p class="text-muted small mb-2"><i class="bi bi-clock"></i> Due: ${due.toLocaleString()}</p>
                            <p class="card-text">${a.description || ''}</p>
                            ${attachHtml}
                            <button class="btn btn-primary btn-sm mt-2" onclick="$('#submitAssignId').val(${a.id}); $('#submitModal').modal('show');"><i class="bi bi-upload"></i> Submit Now</button>
                        </div>
                    </div></div>`;
            } else {
                // Submitted
                let gradeHtml = a.submission.status === 'graded' 
                    ? `<div class="alert alert-success mt-3 mb-0"><strong>Score: ${a.submission.marks_awarded} / ${a.max_marks}</strong><br><em>Feedback:</em> ${a.submission.feedback || 'None'}</div>`
                    : `<div class="alert alert-secondary mt-3 mb-0">Status: Pending Teacher Review</div>`;
                    
                completedHtml += `
                    <div class="col-md-6"><div class="card h-100 shadow-sm border-start border-4 border-success">
                        <div class="card-body">
                            <h5 class="card-title">${a.title} <i class="bi bi-check-circle-fill text-success ms-2"></i></h5>
                            <span class="badge bg-secondary mb-2">${a.exam_name}</span>
                            ${gradeHtml}
                        </div>
                    </div></div>`;
            }
        });
        $('#todoContainer').html(todoHtml || '<p class="text-muted">No pending assignments! 🎉</p>');
        $('#completedContainer').html(completedHtml || '<p class="text-muted">No completed assignments yet.</p>');
    };

    $('#submissionForm').on('submit', async function(e) {
        e.preventDefault();
        const id = $('#submitAssignId').val();
        const formData = new FormData(this);
        await window.authenticatedFetch(`/api/student/assignments/${id}/submit`, { method: 'POST', body: formData });
        $('#submitModal').modal('hide');
        loadAssignments(); // Refresh view
    });
    loadAssignments();
});
</script>
{% endblock %}
