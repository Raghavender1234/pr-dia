{% extends "base.html" %}

{% block title %}Manage Assignments{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Assignments</h2>
            <p class="text-muted mb-0">Create, manage and grade student assignments and essays.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createAssignmentModal">
            <i class="bi bi-plus-lg me-1"></i> New Assignment
        </button>
    </div>

    <div id="pageMessage" class="mb-3"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table id="assignmentsTable" class="table table-hover align-middle" width="100%"></table>
            </div>
        </div>
    </div>
</div>

<!-- Create Assignment Modal -->
<div class="modal fade" id="createAssignmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Create New Assignment</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="createAssignmentForm" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" required placeholder="e.g. Essay on Climate Change">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Provide instructions..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Attach File <small class="text-muted">(Optional)</small></label>
                        <input type="file" class="form-control" name="file" accept=".pdf,.doc,.docx,.jpg,.png">
                        <small class="text-muted">Attach a PDF, Image, or Doc with instructions.</small>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Due Date <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" name="due_date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Max Marks</label>
                            <input type="number" class="form-control" name="max_marks" value="100" min="1">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success" id="saveAssignmentBtn"><span class="spinner-border spinner-border-sm d-none me-1" id="assignSpinner"></span>Save Assignment</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
$(document).ready(function() {
    const table = $('#assignmentsTable').DataTable({
        ajax: {
            url: '/api/main-co-admin/assignments',
            dataSrc: '',
            beforeSend: function(xhr) {
                const token = window.APP_CONTEXT && window.APP_CONTEXT.accessToken;
                if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            }
        },
        columns: [
            { 
                data: 'title', 
                title: 'Assignment Title', 
                render: (data, type, row) => {
                    let res = `<a href="/admin/assignments/${row.id}/grade" class="text-decoration-none text-primary fs-5 fw-bold">${data}</a>`;
                    if(row.attachment_url) res += `<br><a href="${row.attachment_url}" target="_blank" class="badge bg-info text-decoration-none mt-1"><i class="bi bi-paperclip"></i> View Attachment</a>`;
                    return res;
                } 
            },
            { data: 'due_date', title: 'Due Date', render: data => new Date(data).toLocaleString() },
            { data: 'max_marks', title: 'Max Marks' },
            { 
                data: null, 
                title: 'Progress',
                render: (data, type, row) => `
                    <div class="d-flex align-items-center">
                        <span class="badge bg-secondary me-1">${row.submissions_count} Submitted</span>
                        <span class="badge bg-success">${row.graded_count} Graded</span>
                    </div>
                `
            },
            {
                data: 'id',
                title: 'Actions',
                orderable: false,
                render: id => `<a href="/admin/assignments/${id}/grade" class="btn btn-sm btn-outline-primary">Grade Submissions</a>`
            }
        ],
        order: [[1, 'desc']]
    });

    $('#createAssignmentForm').on('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        // Convert datetime to UTC
        formData.set('due_date', new Date(formData.get('due_date')).toISOString());
        
        $('#saveAssignmentBtn').prop('disabled', true);
        $('#assignSpinner').removeClass('d-none');
        
        try {
            await window.authenticatedFetch('/api/main-co-admin/assignments', { method: 'POST', body: formData });
            $('#createAssignmentModal').modal('hide');
            this.reset();
            table.ajax.reload();
        } catch(err) {
            alert('Failed to create assignment.');
        } finally {
            $('#saveAssignmentBtn').prop('disabled', false);
            $('#assignSpinner').addClass('d-none');
        }
    });
});
</script>
{% endblock %}
