<div class="modal fade" id="reportOrgModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Report an Issue with {{ g.current_organization.name }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="reportOrgMessage"></div>
        <p class="text-muted small">If you believe this organization is posting inappropriate content, spam, or violating copyrights, please let us know.</p>
        <form id="reportOrgForm">
          <div class="mb-3">
            <label for="reportOrgReason" class="form-label">Reason</label>
            <select class="form-select" id="reportOrgReason" required>
              <option value="" disabled selected>-- Select a reason --</option>
              <option value="inappropriate_content">Inappropriate/Offensive Content</option>
              <option value="spam_or_irrelevant">Spam or Irrelevant Content</option>
              <option value="copyright_violation">Copyright Violation</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="reportOrgComments" class="form-label">Additional Comments</label>
            <textarea class="form-control" id="reportOrgComments" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-danger w-100">
              <span class="spinner-border spinner-border-sm d-none me-2"></span>
              Submit Report
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
