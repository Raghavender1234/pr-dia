{% extends "base.html" %}

{% block title %}Request Password Reset{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Forgot Your Password?</h2>
                    <p class="text-center text-muted mb-4">No problem. Enter your email address below and we will send you a link to reset it.</p>
                    
                    <div id="message-area" class="mb-3"></div>

                    <form id="request-reset-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Send Reset Link</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
document.getElementById('request-reset-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const messageArea = document.getElementById('message-area');
    
    try {
        const response = await fetch('/api/auth/password/request-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        const data = await response.json();

        // For security, we show a success message even if the email doesn't exist
        messageArea.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
        document.getElementById('request-reset-form').reset();

    } catch (error) {
        messageArea.innerHTML = `<div class="alert alert-danger">An error occurred. Please try again.</div>`;
    }
});
</script>
{% endblock %}
